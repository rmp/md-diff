<!DOCTYPE html>
<html lang="en">
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>md-diff demo</title>
	<style>
	 *, *::before, *::after { box-sizing: border-box; }
	 body {
	     font-family: system-ui, sans-serif;
	     max-width: 1400px;
	     margin: 0 auto;
	     padding: 24px;
	     background: #f0f2f5;
	     color: #24292f;
	 }
	 h1 { font-size: 1.4rem; margin-bottom: 4px; }
	 p.sub { color: #57606a; font-size: 0.9rem; margin: 0 0 24px; }
	 section { margin-bottom: 40px; }
	 h2 { font-size: 1rem; margin: 0 0 8px; color: #444; }

	 /* load the UMD bundle built by rollup */
	</style>
    </head>
    <body>

	<h1>md-diff web component demo</h1>
	<p class="sub">A side-by-side markdown diff viewer, implemented as a zero-dependency web component.</p>

	<!-- ── Example 1: default styling with editable textareas ──────────────── -->
	<section>
	    <h2>Default — editable textareas, side-by-side diff</h2>
	    <md-diff
		id="demo1"
		diff-height="350px"
		textarea-height="180px"
	    ></md-diff>
	</section>

	<!-- ── Example 2: textareas hidden ────────────────────────────────────── -->
	<section>
	    <h2>Textareas hidden (show-textareas="false")</h2>
	    <md-diff
		id="demo2"
		show-textareas="false"
		diff-height="300px"
	    ></md-diff>
	</section>

	<!-- ── Example 3: custom colours ─────────────────────────────────────── -->
	<section>
	    <h2>Custom colours (dark-ish theme)</h2>
	    <md-diff
		id="demo3"
		show-textareas="false"
		diff-height="300px"
		background-color="#1e1e1e"
		border-color="#3a3a3a"
		insertion-color="#1a3a1a"
		insertion-text-color="#a8d5a2"
		deletion-color="#3a1a1a"
		deletion-text-color="#d5a2a2"
		line-number-color="#666"
		line-number-bg="#2a2a2a"
		empty-color="#252525"
		font-size="12px"
		left-label="v1"
		right-label="v2"
	    ></md-diff>
	</section>

	<!-- ── Load bundle then assign content once the element is defined ──── -->
	<script type="module">
	 await import('../dist/md-diff.esm.js').catch(() => import('../src/index.js'));

	 const doc1 = `# Document Version 1

This is the original text.

## Features
- Feature A
- Feature B
- Feature C

Some content here.
`;

	 const doc2 = `# Document Version 2

This is the **modified** text.

## Features
- Feature A
- Feature B (updated)
- Feature C
- Feature D *(new)*

Some updated content here.

## Notes
Added a new section.
`;

	 // Assign content via JS property API (avoids HTML-encoding issues)
	 ['demo1', 'demo2', 'demo3'].forEach(id => {
	     const el = document.getElementById(id);
	     el.leftContent  = doc1;
	     el.rightContent = doc2;
	 });
	</script>
    </body>
</html>
